name: Build macOS Demo

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-macos:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple-Silicon
            runner: macos-15
            python_architecture: arm64
            target_architecture: arm64
          - name: Intel
            runner: macos-15-intel
            python_architecture: x64
            target_architecture: x86_64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Download source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_architecture }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build macOS application
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --target-arch "${{ matrix.target_architecture }}" \
            leadharbor-macos.spec

      - name: Apply ad-hoc signature
        run: |
          codesign \
            --force \
            --deep \
            --sign - \
            dist/KCC-LeadHarbor.app

          codesign \
            --verify \
            --deep \
            --strict \
            dist/KCC-LeadHarbor.app

      - name: Create ZIP package
        run: |
          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            dist/KCC-LeadHarbor.app \
            "KCC-LeadHarbor-macOS-${{ matrix.name }}.zip"

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: KCC-LeadHarbor-macOS-${{ matrix.name }}
          path: KCC-LeadHarbor-macOS-${{ matrix.name }}.zip
          if-no-files-found: error
          retention-days: 30
